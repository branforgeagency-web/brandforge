<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap");
    .center-title { font-family: "Outfit", sans-serif; font-weight: 900; font-size: 72px; fill: #FFFFFF; text-anchor: middle; letter-spacing: -2px; }
    .center-title span { fill: #EF4136; }
    .center-sub { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 14px; fill: rgba(255, 255, 255, 0.65); text-anchor: middle; letter-spacing: 3px; text-transform: uppercase; }
    .sketch-ring { stroke: #EF4136; stroke-width: 3.5; fill: none; stroke-dasharray: 12 6; }
