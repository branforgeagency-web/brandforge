    <text class="center-title" y="25">CONTENT</text>
    <text class="center-sub" y="70">AUTHORITY EDITORIAL COPYWRITING</text>
  </g>

  <!-- SURROUNDING HAND-DRAWN NODES & FLOWS -->
  
