<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bf-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4136" />
      <stop offset="100%" stop-color="#B3241B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EF4136" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Badge Background -->
  <rect width="512" height="512" rx="128" fill="#0A0A0C"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>

  <!-- High-Tech BrandForge Flame & Forge "B" Icon -->
  <g filter="url(#shadow)">
    <!-- Main Crimson Forge Mark -->
    <path d="M150 110 H295 C355 110 395 140 395 190 C395 228 365 252 325 262 C375 274 405 304 405 352 C405 408 358 438 290 438 H150 V110 Z" fill="url(#bf-glow)" />
    
    <!-- Cutout for High-Contrast "B" Form -->
    <path d="M220 165 V235 H280 C305 235 320 222 320 200 C320 178 305 165 280 165 H220 Z" fill="#0A0A0C" />
    <path d="M220 285 V380 H285 C315 380 330 365 330 332.5 C330 300 315 285 285 285 H220 Z" fill="#0A0A0C" />
  </g>

  <!-- Accent Ember Point -->
  <circle cx="410" cy="115" r="28" fill="#EF4136" />
</svg>