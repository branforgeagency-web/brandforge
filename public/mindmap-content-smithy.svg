  <!-- DECORATIVE HAND-DRAWN AMBIENT EMBERS & ACCENTS -->
  <circle cx="600" cy="450" r="230" class="sketch-ring" />
  <circle cx="600" cy="450" r="245" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="4 8" fill="none" />

  <!-- CENTRAL GIANT HAND-DRAWN SERVICE TITLE -->
  <g transform="translate(600, 435)">
